[package]
name = "pdtp"
version = "2.0.0"
description = "Pyditn's Dice Thrower Pro – 3D dice roller for DSA 5"
authors = ["pyditn"]
license = ""
repository = "https://github.com/pyditn2/Pyditn-s-Dice-Thrower-Pro"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pdtp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
